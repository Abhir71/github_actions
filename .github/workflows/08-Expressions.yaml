name: My NPM workflow
on: [push, pull_request]

jobs:
    node-tests:
        runs-on: ubuntu-latest
        steps:
            - if: ${{ github.event_name == 'push' }}
              run: |
                echo "Triggered by a push event"
                echo "Running on ${{ github.ref_name }}"
            - uses: actions/setup-node@v4
              with:
                node-version: 20
            - run: npm ci
            - run: npm test